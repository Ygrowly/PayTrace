[project]
name = "paytrace-backend"
version = "0.0.1"
description = "PayTrace backend (M0b: FastAPI + Celery + Alembic service readiness)."
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "PayTrace" },
]
dependencies = [
    "fastapi>=0.115.0,<0.116.0",
    "uvicorn[standard]>=0.30.0,<0.31.0",
    "sqlalchemy[asyncio]>=2.0.36,<2.1.0",
    "alembic>=1.13.0,<1.14.0",
    "psycopg[binary]>=3.2.0,<3.3.0",
    "celery[redis]>=5.4.0,<5.5.0",
    "redis>=5.0.0,<6.0.0",
    "boto3>=1.35.0,<1.36.0",
    "pydantic>=2.9.0,<2.10.0",
    "pydantic-settings>=2.5.0,<2.6.0",
    "duckdb>=1.1.0,<1.2.0",
    "pyarrow>=17.0.0,<18.0.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.7.0,<0.8.0",
    "pytest>=8.3.0,<8.4.0",
    "pytest-asyncio>=0.24.0,<0.25.0",
    "httpx>=0.27.0,<0.28.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "B",
    "UP",
    "ASYNC",
    "S",
    "T20",
]

[tool.ruff.lint.per-file-ignores]
# Test files intentionally use plain asserts and may exec-like patterns.
"tests/**/*.py" = ["S101"]
# CLI scripts print progress to stdout.
"scripts/**/*.py" = ["T201"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
