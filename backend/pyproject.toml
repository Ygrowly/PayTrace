[project]
name = "paytrace-backend"
version = "0.0.1"
description = "PayTrace backend (M0a skeleton). Application dependencies arrive in M0b."
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "PayTrace" },
]
# M0a deliberately declares no runtime dependencies. FastAPI, SQLAlchemy,
# Celery, DuckDB, etc. will be added in M0b / M1 per the plan.
dependencies = []

[project.optional-dependencies]
# Empty dev group for M0a so `uv sync` has nothing to install beyond the
# project itself. Real dev tooling (ruff, pytest, mypy) arrives in M0b.
dev = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv]
package = true
