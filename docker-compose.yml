# PayTrace local infrastructure compose.
# Default: backing services (PostgreSQL, Redis, MinIO) only.
# Full stack: `docker compose --profile full up -d`

services:
  postgres:
    image: postgres:16-alpine
    container_name: paytrace-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-paytrace}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-paytrace_dev}
      POSTGRES_DB: ${POSTGRES_DB:-paytrace}
    ports:
      - "${POSTGRES_PORT:-54320}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-paytrace} -d ${POSTGRES_DB:-paytrace}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: paytrace-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    container_name: paytrace-minio
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-paytrace}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-paytrace_dev_secret}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  minio-init:
    image: minio/mc:RELEASE.2024-11-21T17-21-54Z
    container_name: paytrace-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ACCESS_KEY:-paytrace} ${MINIO_SECRET_KEY:-paytrace_dev_secret};
      mc mb -p local/${MINIO_BUCKET:-paytrace} || true;
      mc anonymous set none local/${MINIO_BUCKET:-paytrace} || true;
      echo 'MinIO bucket initialized.';
      "
    restart: "no"

  # --- Full-stack profile (plan § 25.2) -----------------------------------

  api:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: paytrace-api
    profiles: ["full"]
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      - APP_ENV=${APP_ENV:-dev}
      - DATABASE_URL=postgresql+psycopg://${POSTGRES_USER:-paytrace}:${POSTGRES_PASSWORD:-paytrace_dev}@postgres:5432/${POSTGRES_DB:-paytrace}
      - REDIS_URL=redis://redis:6379/0
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-paytrace}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-paytrace_dev_secret}
      - MINIO_BUCKET=${MINIO_BUCKET:-paytrace}
      - SCENARIO_ROOT=/data/scenarios
      - ARTIFACT_ROOT=/data/artifacts
      - ARTIFACT_STORE_BACKEND=${ARTIFACT_STORE_BACKEND:-local}
      - FRONTEND_ORIGIN=${FRONTEND_ORIGIN:-http://localhost:3000}
      - TRUSTED_HOSTS=${TRUSTED_HOSTS:-["localhost","127.0.0.1"]}
      - MODEL_PROVIDER=${MODEL_PROVIDER:-rule_based}
      - MODEL_BASE_URL=${MODEL_BASE_URL:-}
      - MODEL_API_KEY=${MODEL_API_KEY:-}
      - MODEL_NAME=${MODEL_NAME:-}
    volumes:
      - runtime_data:/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/live', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: paytrace-worker
    profiles: ["full"]
    command:
      ["uv", "run", "--no-sync", "celery", "-A", "app.tasks.celery_app", "worker", "-l", "info", "-P", "solo"]
    environment:
      - APP_ENV=${APP_ENV:-dev}
      - DATABASE_URL=postgresql+psycopg://${POSTGRES_USER:-paytrace}:${POSTGRES_PASSWORD:-paytrace_dev}@postgres:5432/${POSTGRES_DB:-paytrace}
      - REDIS_URL=redis://redis:6379/0
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-paytrace}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-paytrace_dev_secret}
      - MINIO_BUCKET=${MINIO_BUCKET:-paytrace}
      - SCENARIO_ROOT=/data/scenarios
      - ARTIFACT_ROOT=/data/artifacts
      - ARTIFACT_STORE_BACKEND=${ARTIFACT_STORE_BACKEND:-local}
      - FRONTEND_ORIGIN=${FRONTEND_ORIGIN:-http://localhost:3000}
      - TRUSTED_HOSTS=${TRUSTED_HOSTS:-["localhost","127.0.0.1"]}
      - MODEL_PROVIDER=${MODEL_PROVIDER:-rule_based}
      - MODEL_BASE_URL=${MODEL_BASE_URL:-}
      - MODEL_API_KEY=${MODEL_API_KEY:-}
      - MODEL_NAME=${MODEL_NAME:-}
    volumes:
      - runtime_data:/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped

  beat:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: paytrace-beat
    profiles: ["full"]
    command:
      ["uv", "run", "--no-sync", "celery", "-A", "app.tasks.celery_app", "beat", "-l", "info"]
    environment:
      - APP_ENV=${APP_ENV:-dev}
      - DATABASE_URL=postgresql+psycopg://${POSTGRES_USER:-paytrace}:${POSTGRES_PASSWORD:-paytrace_dev}@postgres:5432/${POSTGRES_DB:-paytrace}
      - REDIS_URL=redis://redis:6379/0
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-paytrace_dev_secret}
      - ARTIFACT_STORE_BACKEND=${ARTIFACT_STORE_BACKEND:-local}
      - FRONTEND_ORIGIN=${FRONTEND_ORIGIN:-http://localhost:3000}
      - TRUSTED_HOSTS=${TRUSTED_HOSTS:-["localhost","127.0.0.1"]}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: paytrace-web
    profiles: ["full"]
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  minio_data:
  runtime_data:
