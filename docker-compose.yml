# PayTrace local infrastructure compose (M0a skeleton).
# Starts only the backing services: PostgreSQL, Redis, MinIO.
# API, Celery Worker, and Next.js are run locally for hot reload.

services:
  postgres:
    image: postgres:16-alpine
    container_name: paytrace-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-paytrace}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-paytrace_dev}
      POSTGRES_DB: ${POSTGRES_DB:-paytrace}
    ports:
      - "${POSTGRES_PORT:-54320}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-paytrace} -d ${POSTGRES_DB:-paytrace}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: paytrace-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    container_name: paytrace-minio
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-paytrace}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-paytrace_dev_secret}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  minio-init:
    image: minio/mc:RELEASE.2024-11-21T17-21-54Z
    container_name: paytrace-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ACCESS_KEY:-paytrace} ${MINIO_SECRET_KEY:-paytrace_dev_secret};
      mc mb -p local/${MINIO_BUCKET:-paytrace} || true;
      mc anonymous set download local/${MINIO_BUCKET:-paytrace} || true;
      echo 'MinIO bucket initialized.';
      "
    restart: "no"

volumes:
  postgres_data:
  redis_data:
  minio_data:
